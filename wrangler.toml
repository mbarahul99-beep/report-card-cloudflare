# wrangler.toml — Cloudflare Pages Functions with D1, R2, and KV
# Usage: npx wrangler pages dev dist --d1 DB=5384ec04-0241-4fcf-8d04-cd205491ac70

name = "report-card-cloudflare"
account_id = "728b18da5c50c283621bc98ed14d520f"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-26"

# ── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "report-card-d1"
database_id = "5384ec04-0241-4fcf-8d04-cd205491ac70"

# ── R2 Bucket (report-card assets: logos, watermarks, photos) ─
[[r2_buckets]]
binding = "REPORT_CARD_ASSETS"
bucket_name = "report-card-assets"

# ── KV Namespace (fast config caching) ────────────────────────
# Create this namespace in the dashboard or via:
#   npx wrangler kv namespace create CONFIG_CACHE
# Then replace the id below with the returned namespace ID.
[[kv_namespaces]]
binding = "CONFIG_CACHE"
id = "acfbfe1e69c5407b91b584c3301c9db8"
